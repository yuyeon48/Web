<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Transition</title>
  <style>
    * { box-sizing: border-box; margin: 0; }

    .container {
      display: flex;
      flex-direction: column; 
      align-items: center;    
      gap: 30px;              
      padding: 50px 0;
      background-color: #ffffff;
      min-height: 100vh;
    }

    .box-item {
      width: 150px;
      height: 150px;
      border-radius: 15px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      
    
      background: url('./\ -5.jpg') no-repeat center / cover purple;

   
      transition-property: all;
      transition-duration: 0.6s;
      transition-timing-function: ease-in-out;
      transition-delay: 0.1s;
      transition-behavior: allow-discrete;
    }


    .box-item.active {
  
      background-color: #2ecc71 !important; 
     
      background-blend-mode: multiply; 
      transform: translateY(-10px); 
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="box-item img1" onclick="changeColor(this)">Box 1</div>
    <div class="box-item img2" onclick="changeColor(this)">Box 2</div>
    <div class="box-item img3" onclick="changeColor(this)">Box 3</div>
  </div>

  <script>
    function changeColor(element) {
      
      element.classList.add('active');

      
      setTimeout(() => {
        element.classList.remove('active');
      }, 1000);
    }
  </script>

</body>
</html>
