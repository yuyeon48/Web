<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    .stage {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      min-height: 100vh;
      padding-bottom: 50px;
      background-color: #f0f0f0;
      border-bottom: 8px solid #333; 
    }

    @keyframes bounceAndSquash {
      0% {
    
        transform: translateY(-800px) scaleY(1);
      }
      85% {
        
        transform: translateY(0) scaleY(1);
      }
      95% {
       
        transform: translateY(0) scaleY(0.7);
      }
      100% {
        
        transform: translateY(0) scaleY(1);
      }
    }

    .ball {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: url('./Tamama.jpg') no-repeat center / cover purple;

  animation-name: bounceAndSquash;

  animation-duration: 0.6s;

  animation-iteration-count: infinite;

  animation-direction: alternate;

  animation-timing-function: cubic-bezier(0.3, 0, 0.8, 0.15);

  animation-delay: 0s;

  animation-fill-mode: both;
}

@keyframes bounceAndSquash {
  0% { transform: translateY(-800px) scaleY(1); }   
  85% { transform: translateY(0) scaleY(1); }     
  95% { transform: translateY(0) scaleY(0.7); }    
  100% { transform: translateY(0) scaleY(1); }     
}
  </style>
</head>
<body>
  <div class="stage">
    <div class="ball"></div>
  </div>
</body>
</html>
