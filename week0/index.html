<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
        <title>실습</title>
        <style>
            div,span {
                margin: 10px;
                padding: 10px;
                color: white;
                font-weight: bold;
        }
        .block-box{
            display: block;
            background-color: aquamarine;
            width: 200px;
            height:50px;
        }
        .inline-box{
            background-color: #2ecc71;
            width: 200px; 
            height: 50px;
        }
        .inline-block-box {
            display: inline-block;
            background-color: #3498db;
            width: 150px;
            height: 50px;
        }
        </style>
</head>
<body>
<h2>Block</h2>
    <div class="block-box">Block 1</div>
    <div class="block-box">Block 2</div>
    <p>블록 요소는 너비를 지정해도 다음 요소가 무조건 아래로 내려갑니다.</p>

    <hr>

    <h2>Inline</h2>
    <span class="inline-box">Inline 1</span>
    <span class="inline-box">Inline 2</span>
    <p>인라인 요소는 한 줄에 나열되며, CSS로 설정한 width/height가 적용되지 않습니다.</p>

    <hr>

    <h2>Inline-Block</h2>
    <div class="inline-block-box">Inline-Block 1</div>
    <div class="inline-block-box">Inline-Block 2</div>
    <p>인라인처럼 한 줄에 놓이지만, 블록처럼 크기를 조절할 수 있습니다.</p>

</body>
</html>
